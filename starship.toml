add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_state$git_status]($style)$nodejs$python$rust$ruby$java$golang$character"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = "≡${count} "
staged     = "+${count} "
renamed    = "»${count} "
deleted    = "✘${count} "

# Shown during a rebase, merge, cherry-pick or bisect, e.g. (REBASING 2/5)
[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = "bold yellow"

# Language versions, shown only inside projects that use them
[nodejs]
format = "[$symbol$version]($style) "
symbol = " "
style = "green"

[python]
format = "[$symbol$version( \\($virtualenv\\))]($style) "
symbol = " "
style = "yellow"

[rust]
format = "[$symbol$version]($style) "
symbol = " "
style = "red"

[ruby]
format = "[$symbol$version]($style) "
symbol = " "
style = "red"

[java]
format = "[$symbol$version]($style) "
symbol = " "
style = "red"

[golang]
format = "[$symbol$version]($style) "
symbol = " "
style = "cyan"
